server:
  port: 8084

spring:
  application:
    name: user-service
  datasource:
    username: user
    password: user123
    url: jdbc:mysql://localhost:3309/userdb?useSSL=false&allowPublicKeyRetrieval=true
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL57Dialect
    hibernate:
      ddl-auto: update
      show-sql: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
